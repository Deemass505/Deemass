  const move=e=>{const b=e.currentTarget.getBoundingClientRect(),i=Math.round(((e.clientX-b.left)/b.width*W-p.l)/((W-p.l-p.r)/(n-1)));setHv(Math.max(0,Math.min(n-1,i)))};
  const ix=hv==null?n-1:hv;
  return <div>
    <div className="flex flex-wrap items-center gap-x-5 gap-y-1 text-sm mb-2">
      <span className="mu mono text-xs">{labels[ix]}</span>

    </div>
    <svg viewBox={`0 0 ${W} ${h}`} className="w-full" style={{touchAction:'pan-y'}} onPointerMove={move} onPointerLeave={()=>setHv(null)}>
      {[0,1,2,3].map(k=>{const v=mn+(mx-mn)*k/3;return <g key={k}><line x1={p.l} x2={W-p.r} y1={y(v)} y2={y(v)} stroke="var(--bd)"/><text x={p.l-6} y={y(v)+4} textAnchor="end" fontSize="11" fill="var(--mu)">{fmt(v)}</text></g>})}
      {labels.map((l,i)=>{const yr=l.slice(-4);if(!i||yr===labels[i-1].slice(-4))return null;return (+labels[n-1].slice(-4)-+labels[0].slice(-4)>8&&yr%2)?null:<text key={i} x={x(i)} y={h-6} textAnchor="middle" fontSize="11" fill="var(--mu)">{yr}</text>})}
      {series.map(s=><g key={s.name}>{area&&<path d={path(s.d)+`L${x(n-1)},${y(mx)}L${x(0)},${y(mx)}Z`} fill={s.c} opacity=".18"/>}<path d={path(s.d)} fill="none" stroke={s.c} strokeWidth={s.w||2} strokeLinejoin="round"/></g>)}
      {hv!=null&&<g><line x1={x(hv)} x2={x(hv)} y1={p.t} y2={h-p.b} stroke="var(--mu)" strokeDasharray="3 3"/>{series.map(s=><circle key={s.name} cx={x(hv)} cy={y(s.d[hv])} r="4" fill={s.c}/>)}</g>}

}
const Card=({t,s,r,children,cls=''})=><section className={'card p-4 md:p-5 min-w-0 '+cls}>{(t||r)&&<div className="flex items-start justify-between gap-3 mb-3"><div><h2 className="font-bold">{t}</h2>{s&&<p className="mu text-xs mt-0.5 leading-relaxed">{s}</p>}</div>{r}</div>}{children}</section>;
const Chips=({o,v,set})=><div className="flex gap-1.5 flex-wrap">{o.map(([k,l])=><button key={k} onClick={()=>set(k)} className="chip" data-on={v===k}>{l}</button>)}</div>;
const Tbl=({cols,rows,empty='Tidak ada data pada filter ini.'})=>rows.length?<div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr>{cols.map(c=><th key={c[0]}>{c[0]}</th>)}</tr></thead><tbody>{rows.map((r,i)=><tr key={i}>{cols.map(c=><td key={c[0]} className={c[2]?'mono':''}>{c[1](r)}</td>)}</tr>)}</tbody></table></div>:<div className="mu text-sm py-8 text-center">{empty}</div>;
const Bd=({c,children})=><span className="badge" style={{color:`var(${c})`,background:`color-mix(in srgb, var(${c}) 16%, transparent)`}}>{children}</span>;

const Kpi=({i:I,l,v,c='--br',s})=><div className="card p-3.5"><div className="flex items-center justify-between"><span className="mu text-xs font-medium">{l}</span><span className="w-7 h-7 rounded-lg grid place-items-center" style={{background:`color-mix(in srgb, var(${c}) 16%, transparent)`,color:`var(${c})`}}><I size={15}/></span></div><div className="mono text-xl font-bold mt-2">{v}</div>{s&&<div className="mu text-xs mt-0.5">{s}</div>}</div>;
const Seg=({o,v,set,s,off})=><div className={'grid grid-cols-4 gap-1 '+(off?'opacity-40 pointer-events-none':'')}>{o.map(x=><button key={x} onClick={()=>set(x)} className="mono text-sm py-1.5 rounded-lg border" style={{borderColor:v===x?'var(--ac)':'var(--bd)',background:v===x?'var(--ac)':'transparent',color:v===x?'var(--on)':'var(--tx)'}}>{x}{s}</button>)}</div>;

  {[['Fast EMA','ef',2,12],['Slow EMA','es',3,24],['Trend EMA','et',4,36],['ATR period','ap',2,24],['ATR mult','am',1,6]].map(([l,k,a,b])=><Num key={k} l={l} v={P[k]} min={a} max={b} set={v=>setP({...P,[k]:v})}/>)}</div></Card>;
const col=v=>v>=0?'var(--up)':'var(--dn)';

function Bt({c}){

  const grid=useMemo(()=>[5,10,15,20].map(n=>[3,6,9,12].map(l=>{const q=bt(D,{s:gs,L:l,N:n,fee});return met(q.E,q.rets).cagr})),[D,gs,fee]);
  const gmax=Math.max(...grid.flat()),yrs=res.rets.length/12,ya=yearly(D,res.rets),yb=yearly(D,res.bm),ymax=Math.max(...ya.concat(yb).map(a=>Math.abs(a[1]))),diff=m.cagr-b.cagr;

    <Card t="Pengaturan strategi"><div className="grid md:grid-cols-3 gap-2 mb-4">{ST.map(([k,t,d])=><button key={k} onClick={()=>setSt(k)} className="text-left rounded-xl border p-3" style={{borderColor:st===k?'var(--ac)':'var(--bd)',boxShadow:st===k?'inset 3px 0 0 var(--ac)':'none'}}><div className="text-sm font-bold">{t}</div><div className="mu text-xs mt-0.5">{d}</div></button>)}</div>
      <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div><div className="text-xs mu font-medium mb-1.5">Periode momentum</div><Seg o={[3,6,9,12]} v={L} set={setL} s=" bln" off={st==='ew'}/></div>
        <div><div className="text-xs mu font-medium mb-1.5">Jumlah saham</div><Seg o={[5,10,15,20]} v={N} set={setN} s="" off={st==='ew'}/></div>
        <div><div className="flex justify-between text-xs mu font-medium mb-1"><span>Biaya per transaksi</span><span className="mono">{nf(fee,2)}%</span></div><input type="range" min="0" max="0.5" step="0.05" value={fee} onChange={e=>setFee(+e.target.value)} className="w-full"/></div>
        <div><div className="text-xs mu font-medium mb-1.5">Modal awal</div><select value={cap} onChange={e=>setCap(+e.target.value)} className="w-full rounded-lg px-2.5 py-2 text-sm">{[100e6,500e6,1e9].map(v=><option key={v} value={v}>{rp(v)}</option>)}</select></div>
      </div></Card>
    <section className="card hero p-5 md:p-6">
      <div className="flex flex-wrap items-end justify-between gap-4 mb-4"><div><div className="mu text-sm font-medium">CAGR strategi</div><div className="mono font-extrabold leading-none" style={{fontSize:'clamp(2.8rem,9vw,4.2rem)',color:'var(--ac)'}}>{pc(m.cagr)}<span className="mu text-lg font-medium"> /tahun</span></div><div className="text-sm mt-2">{rp(cap)} menjadi <b>{rp(cap*res.E[res.E.length-1])}</b> dalam {nf(yrs,1)} tahun</div></div>
        <div className="md:text-right text-sm"><div className="mu">Benchmark bobot sama</div><div className="mono text-2xl font-bold">{pc(b.cagr)}</div><div className="mono font-semibold" style={{color:col(diff)}}>{nf(diff*100,1)} poin CAGR</div></div></div>
      <Chart labels={labels} fmt={rp} series={[{name:'Strategi',d:res.E.map(v=>v*cap),c:'var(--ac)',w:2.4},{name:'Benchmark',d:res.B.map(v=>v*cap),c:'var(--bm)',w:1.6}]}/></section>
    <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-3">

      <Kpi i={Gauge} l="Sharpe" v={nf(m.sharpe,2)} c="--ac"/><Kpi i={Layers} l="Calmar" v={nf(m.calmar,2)} c="--ac"/><Kpi i={Percent} l="Bulan positif" v={pc(m.win,0)}/></div>
    <div className="grid md:grid-cols-2 gap-4">
      <Card t="Drawdown"><Chart labels={labels} h={200} area fmt={v=>pc(v,0)} series={[{name:'Strategi',d:m.dd,c:'var(--dn)'},{name:'Benchmark',d:b.dd,c:'var(--bm)',w:1.2}]}/></Card>
      <Card t="Return tahunan" s="Tahun terakhir belum penuh."><div className="space-y-1.5 max-h-[230px] overflow-y-auto pr-1">{ya.map(([y,v],i)=><div key={y} className="grid grid-cols-[38px_1fr_54px_54px] items-center gap-2 text-xs mono"><span className="mu">{y}</span><div><div style={{height:5,borderRadius:3,marginBottom:2,width:Math.max(2,Math.abs(v)/ymax*100)+'%',background:'var(--ac)'}}/><div style={{height:5,borderRadius:3,width:Math.max(2,Math.abs(yb[i][1])/ymax*100)+'%',background:'var(--bm)'}}/></div><span style={{color:col(v)}}>{sg(v,0)}</span><span className="mu">{sg(yb[i][1],0)}</span></div>)}</div></Card>
    </div>
    <Card t="Peta sensitivitas CAGR" s="Hijau berarti mengalahkan benchmark. Pilih area yang hijau di sekelilingnya, bukan satu sel terbaik, supaya hasilnya bukan kebetulan data. Klik sel untuk memakainya."><div className="overflow-x-auto"><table className="mono text-sm w-full"><thead><tr><th>Top-N \ periode</th>{[3,6,9,12].map(l=><th key={l}>{l} bln</th>)}</tr></thead><tbody>{[5,10,15,20].map((n,r)=><tr key={n}><th>{n} saham</th>{[3,6,9,12].map((l,k)=>{const g=grid[r][k],sel=n===N&&l===L&&st!=='ew';return <td key={l} onClick={()=>{setN(n);setL(l);if(st==='ew')setSt('mom')}} style={{cursor:'pointer',borderRadius:8,outline:sel?'2px solid var(--ac)':'none',outlineOffset:-2,background:`color-mix(in srgb, var(${g>b.cagr?'--up':'--dn'}) ${Math.round(15+Math.min(55,Math.abs(g-b.cagr)*400))}%, transparent)`,fontWeight:g===gmax?700:400}}>{pc(g)}</td>})}</tr>)}</tbody></table></div></Card>

const TfBar=({S})=><div className="flex flex-wrap items-center justify-between gap-3"><Chips v={S.tf} set={S.setTf} o={[['m','Bulanan'],['d','Harian']]}/><span className="mu text-xs mono">Bar terakhir: {bl(S.D.d[S.D.d.length-1],S.tf)}</span></div>;

function Buy({c}){
  const {S}=c,dn=S.tf==='d',[w,setW]=useState(3);

  if(!S.sgl)return <Head S={S}/>;

  return <>
    <Head S={S}/>

      <Tbl rows={rows} empty="Tidak ada sinyal beli pada rentang ini." cols={[['Saham',r=><b>{r.k}</b>],[dn?'Tgl sinyal':'Bulan sinyal',r=>bl(D.d[r.e],tf)],['Harga beli',r=>px(r.ep),1],['Sekarang',r=>px(r.cur),1],['Untung / rugi',r=><Pl v={r.fl}/>],['Status',r=>r.ds<(dn?.03:.05)?<Bd c="--dn">Dekat stop</Bd>:<Bd c="--up">Valid</Bd>],['Trailing stop',r=>px(r.tr),1],['Jarak ke stop',r=>pc(r.ds),1]]}/></Card>
  </>;
}
function Watch({c}){
  const {S}=c,dn=S.tf==='d',[f,setF]=useState('all');
  if(!S.sgl)return <Head S={S}/>;
  const {D,sgl,tf}=S,hot=dn?.02:.06,rows=sgl.watch.filter(r=>f==='all'||r.d<=hot);
  return <>
    <Head S={S}/>
    <Card t="Pantauan kandidat sinyal beli" s={`Saham belum berposisi, di atas Trend EMA, dengan Fast EMA mendekati Slow EMA dari bawah. Harga pemicu adalah perkiraan penutupan ${dn?'besok':'bulan depan'} yang menghasilkan golden cross, dibulatkan ke fraksi harga BEI. Bar terakhir: ${bl(D.d[D.d.length-1],tf)}. Bukan nasihat investasi.`} r={<Chips v={f} set={setF} o={[['all','Semua'],['hot','Sangat dekat']]}/>}>
      <Tbl rows={rows} empty={sgl.free>0&&sgl.below===sgl.free?`Tidak ada kandidat. Syaratnya harga di atas Trend EMA, dan saat ini seluruh ${sgl.free} saham tanpa posisi berada di bawahnya (pasar sedang lemah).`:'Tidak ada kandidat untuk dipantau saat ini.'} cols={[['Saham',r=><b>{r.k}</b>],['Harga sekarang',r=>px(r.cur),1],['Harga pemicu',r=>px(r.p),1],['Jarak ke target',r=>pc(r.d),1],['Momentum',r=><span className="mono">{nf(r.mo,1)} poin</span>],['Prioritas',r=>r.d<=hot?<Bd c="--dn">Sangat dekat</Bd>:<Bd c="--ac">Dekat</Bd>]]}/></Card>
  </>;
}
function Hist({c}){
  const {S}=c,dn=S.tf==='d',[f,setF]=useState('all');
  if(!S.sgl)return <Head S={S}/>;
  const {D,sgl,tf}=S,all=sgl.tr.filter(t=>f==='all'||(f==='w'?t.pnl>0:t.pnl<=0)),rows=all.slice().sort((a,b)=>b.x-a.x).slice(0,80),n=all.length;
  const sm=met(sgl.SE,sgl.sr,dn?252:12),lab=sgl.SE.map((_,j)=>bl(D.d[sgl.s0-1+j],tf)),un=dn?' hari':' bln';
  return <>
    <Head S={S}/>
    <div className="grid grid-cols-2 lg:grid-cols-5 gap-3"><Kpi i={History} l="Trade tertutup" v={n}/><Kpi i={Percent} l="Winrate" v={n?pc(all.filter(t=>t.pnl>0).length/n,0):'-'}/><Kpi i={TrendingUp} l="Rata-rata PnL" v={n?sg(all.reduce((a,t)=>a+t.pnl,0)/n):'-'} c="--ac"/><Kpi i={Target} l="Rata-rata bertahan" v={n?nf(all.reduce((a,t)=>a+t.h,0)/n,1)+un:'-'} c="--bm"/><Kpi i={Gauge} l="CAGR sinyal" v={pc(sm.cagr)} c="--ac" s={dn?'periode pendek':null}/></div>
    <Card t="Kurva ekuitas sinyal" s={dn?'Data harian hanya sekitar 3 tahun, jadi CAGR di sini hasil annualisasi periode pendek dan sangat sensitif. Anggap sebagai gambaran, bukan ramalan.':'Posisi bobot sama saat sinyal valid, sisanya kas.'}><Chart labels={lab} fmt={v=>sg(v-1,0)} series={[{name:'Sinyal EMA',d:sgl.SE,c:'var(--br)',w:2.2}]}/></Card>
    <Card t="Riwayat trade" s={n>80?'Menampilkan 80 trade terbaru.':null} r={<Chips v={f} set={setF} o={[['all','Semua'],['w','Win'],['l','Loss']]}/>}>
      <Tbl rows={rows} cols={[['Saham',r=><b>{r.k}</b>],['Entry',r=>bl(D.d[r.e],tf)],['Exit',r=>bl(D.d[r.x],tf)],['Harga entry',r=>px(r.ep),1],['Harga exit',r=>px(r.xp),1],['Bertahan',r=>r.h+un,1],['PnL',r=><Pl v={r.pnl}/>],['Hasil',r=>r.pnl>0?<Bd c="--up">WIN</Bd>:<Bd c="--dn">LOSS</Bd>],['Alasan exit',r=><span className="mu">{r.r}</span>]]}/></Card>
  </>;
}
function MapP({c}){
  const {S}=c;
  if(!S.sgl)return <Head S={S}/>;
  const o={};S.sgl.tr.forEach(t=>{const a=o[t.k]||(o[t.k]={k:t.k,n:0,w:0,s:0});a.n++;a.w+=t.pnl>0?1:0;a.s+=t.pnl});
  const rows=Object.values(o).sort((a,b)=>b.s-a.s),mx=Math.max(...rows.map(r=>Math.abs(r.s)),.01);
  return <>
    <Head S={S}/>
    <Card t="Peta performa per saham" s="Total PnL adalah jumlah PnL seluruh trade tertutup saham tersebut. Diurutkan dari yang terbaik.">
      {rows.length?<div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-2.5">{rows.map(r=><div key={r.k} className="rounded-xl p-3" style={{border:'1px solid var(--bd)',background:`color-mix(in srgb, var(${r.s>=0?'--up':'--dn'}) ${Math.round(8+Math.abs(r.s)/mx*38)}%, var(--card))`}}>
        <div className="flex justify-between items-baseline"><b>{r.k}</b><Pl v={r.s} d={0}/></div><div className="mu text-xs mt-1 mono">{r.n} trade, win {pc(r.w/r.n,0)}</div><div className="text-xs mt-0.5 mono">rata-rata {sg(r.s/r.n)}</div></div>)}</div>:<div className="mu text-sm py-8 text-center">Belum ada trade tertutup.</div>}</Card>
  </>;
}
function Data({c}){
  const {D,setD,src,setSrc,load,ld,er,upd,DD,setDD}=c,[msg,setMsg]=useState(null),T=D.d.length;
  const up=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const q=parseCSV(r.result),d=q.m;if(d.k.length<2||d.d.length<20)throw 0;setD(d);setSrc('upload');if(q.dd)setDD(q.dd);try{localStorage.setItem('k100',JSON.stringify(d))}catch(_){}setMsg(['ok',`Berhasil memuat ${d.k.length} saham, ${lb(d.d[0])} sampai ${lb(d.d[d.d.length-1])}.${q.dd?` Data harian (${q.dd.d.length} bar) juga terbaca untuk sinyal harian.`:''}`])}catch(_){setMsg(['er','File tidak terbaca. Pakai CSV dengan kolom pertama tanggal dan kolom berikutnya kode saham.'])}};r.readAsText(f);e.target.value=''};
  const reset=()=>{setD(DEF);setSrc('csv');try{localStorage.removeItem('k100')}catch(_){}setMsg(['ok','Kembali ke data bawaan, lalu mencoba memuat harga live.'])};
  const fl=[];D.k.forEach((k,i)=>D.p[i].forEach((v,t)=>{const q=D.p[i][t-1];if(t&&v!=null&&q!=null&&(v/q>2||v/q<.5))fl.push({k,m:lb(D.d[t]),ch:v/q-1})}));
  const bars=D.k.map((k,i)=>({k,n:D.p[i].filter(v=>v!=null).length,f:lb(D.d[D.p[i].findIndex(v=>v!=null)])})).sort((a,b)=>a.n-b.n).slice(0,6);
  return <>
    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3"><Kpi i={Database} l="Jumlah saham" v={D.k.length}/><Kpi i={Layers} l="Jumlah bar bulanan" v={T} c="--bm"/><Kpi i={History} l="Mulai" v={lb(D.d[0])} c="--bm"/><Kpi i={Activity} l="Bar terakhir" v={lb(D.d[T-1])} c="--ac" s={src==='live'?'Yahoo Finance (live)':src==='upload'?'file unggahan Anda':'file CSV bawaan'}/></div>
    <Card t="Perbarui data" s="Harga diambil otomatis dari Yahoo Finance lewat /api/prices (cache 15 menit) dan dimuat ulang tiap 5 menit saat tab terbuka. Anda tetap bisa mengunggah CSV sendiri (harian atau bulanan; CSV harian juga mengaktifkan sinyal harian). Data unggahan bulanan tersimpan di browser Anda saja.">
      <div className="flex flex-wrap gap-2"><label className="flex items-center gap-2 rounded-xl px-4 py-2.5 text-sm font-bold cursor-pointer" style={{background:'var(--ac)',color:'var(--on)'}}><Upload size={16}/>Unggah CSV<input type="file" accept=".csv,text/csv" onChange={up} className="hidden"/></label>
        <button onClick={load} className="flex items-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold card"><RefreshCw size={16} className={ld?'animate-spin':''}/>Muat ulang dari Yahoo</button>{src!=='live'&&<button onClick={reset} className="flex items-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold card"><RotateCcw size={16}/>Pakai data bawaan</button>}</div>
      {er&&<p className="text-sm mt-3 font-medium" style={{color:'var(--dn)'}}>Gagal memuat harga live dari /api/prices, memakai data tersimpan.</p>}
      {upd&&src==='live'&&<p className="mu text-xs mt-3">Terakhir diperbarui {new Date(upd).toLocaleString('id-ID')}.</p>}
      <p className="mu text-xs mt-1">{DD?`Data harian: ${DD.k.length} saham, ${DD.d.length} bar, sampai ${fd(DD.d[DD.d.length-1])}.`:'Data harian belum dimuat. Buka menu Sinyal Beli lalu pilih Harian.'}</p>
      {msg&&<p className="text-sm mt-3 font-medium" style={{color:msg[0]==='ok'?'var(--up)':'var(--dn)'}}>{msg[1]}</p>}</Card>
    <div className="grid md:grid-cols-2 gap-4">
      <Card t="Riwayat data terpendek" s="Saham baru IPO atau data kosong. Mereka baru ikut sinyal setelah punya cukup bar."><Tbl cols={[['Saham',r=><b>{r.k}</b>],['Mulai',r=>r.f],['Jumlah bar',r=>r.n,1]]} rows={bars}/></Card>
      <Card t="Lonjakan harga mencurigakan" s="Perubahan bulanan di atas +100% atau di bawah -50%. Bisa data asli, bisa stock split yang belum disesuaikan."><Tbl cols={[['Saham',r=><b>{r.k}</b>],['Bulan',r=>r.m],['Perubahan',r=><Pl v={r.ch} d={0}/>]]} rows={fl.slice(0,8)} empty="Tidak ada lonjakan ekstrem. Data terlihat bersih."/></Card>
    </div>
  </>;
}

/* ---------- Aplikasi ---------- */
const NAV=[['home','Ringkasan',LayoutDashboard,Home],['bt','Backtest CAGR',LineChart,Bt],['buy','Sinyal Beli',Zap,Buy],['watch','Pantauan',Radar,Watch],['hist','Riwayat Trade',History,Hist],['map','Peta Performa',Grid3x3,MapP],['data','Data',Database,Data]];
function App(){
  const [pg,setPg]=useState('home'),[th,setTh]=useState(()=>matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const [D,setD]=useState(()=>{try{const s=localStorage.getItem('k100');if(s)return JSON.parse(s)}catch(e){}return DEF}),[src,setSrc]=useState(()=>{try{return localStorage.getItem('k100')?'upload':'csv'}catch(e){return 'csv'}}),[upd,setUpd]=useState(null),[ld,setLd]=useState(false),[er,setEr]=useState(false);
  const [DD,setDD]=useState(null),[tf,setTf]=useState('m'),[ldD,setLdD]=useState(false);
  const [P,setP]=useState({m:{ef:3,es:6,et:12,ap:6,am:3},d:{ef:10,es:30,et:100,ap:14,am:3}}),[st,setSt]=useState('mom'),[L,setL]=useState(12),[N,setN]=useState(10),[fee,setFee]=useState(.25),[cap,setCap]=useState(100e6);
  const load=()=>{setLd(true);fetch('/api/prices').then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{if(!j.d||j.d.length<20)throw 0;try{localStorage.removeItem('k100')}catch(e){}setD(j);setSrc('live');setUpd(j.updated);setEr(false)}).catch(()=>setEr(true)).finally(()=>setLd(false))};
  const loadD=()=>{setLdD(true);fetch('/api/prices?tf=d').then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{if(!j.d||j.d.length<150)throw 0;setDD(j)}).catch(()=>{}).finally(()=>setLdD(false))};
  useEffect(()=>{if(src==='upload')return;load();const id=setInterval(()=>{if(!document.hidden)load()},300000);return()=>clearInterval(id)},[src==='upload']);
  useEffect(()=>{if(tf!=='d'||(src==='upload'&&DD))return;loadD();const id=setInterval(()=>{if(!document.hidden)loadD()},300000);return()=>clearInterval(id)},[tf,src==='upload']);
  useEffect(()=>{document.documentElement.dataset.theme=th},[th]);
  const sglM=useMemo(()=>sig(D,P.m,'m'),[D,P.m]),sglD=useMemo(()=>DD?sig(DD,P.d,'d'):null,[DD,P.d]),res=useMemo(()=>bt(D,{s:st,L,N,fee}),[D,st,L,N,fee]);
  const m=met(res.E,res.rets),b=met(res.B,res.bm),sm=met(sglM.SE,sglM.sr),labels=res.E.map((_,j)=>lb(D.d[T0+j-1]));
  const S={tf,setTf,D:tf==='d'&&DD?DD:D,sgl:tf==='d'?sglD:sglM,P:P[tf],setP:v=>setP({...P,[tf]:v}),ld:ldD,loadD};
  const c={D,setD,src,setSrc,load,ld,er,upd,DD,setDD,sgl:sglM,S,st,setSt,L,setL,N,setN,fee,setFee,cap,setCap,res,m,b,sm,labels};
  const srcLb=src==='live'?'Live Yahoo'+(upd?' '+new Date(upd).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):''):src==='upload'?'CSV unggahan':er?'Live gagal, pakai CSV':'CSV bawaan';
  const Page=NAV.find(n=>n[0]===pg)[3],cur=NAV.find(n=>n[0]===pg);
  return <div className="md:flex">
    <aside className="hidden md:flex w-60 shrink-0 flex-col p-4 sticky self-start border-r" style={{top:'env(safe-area-inset-top,0px)',height:'calc(100vh - env(safe-area-inset-top,0px))',borderColor:'var(--bd)'}}>
      <div className="flex items-center gap-2.5 px-1 mb-6"><div className="w-10 h-10 rounded-xl grid place-items-center" style={{background:'linear-gradient(135deg,var(--br),var(--bm))',color:'var(--on)'}}><Radar size={22}/></div><div><div className="font-extrabold leading-tight">saintcelucid</div><div className="mu text-xs font-medium">Kompas100 Signal Engine</div></div></div>
      <nav className="flex flex-col gap-1">{NAV.map(([k,l,I])=><button key={k} className="nav" data-on={pg===k} onClick={()=>setPg(k)}><I size={18}/>{l}</button>)}</nav>
      <div className="mt-auto card p-3 text-xs"><div className="mu font-medium">Data terakhir</div><div className="mono font-bold mt-0.5">{lb(D.d[D.d.length-1])}</div><div className="mu mt-1">{D.k.length} saham</div></div>
    </aside>
    <div className="flex-1 min-w-0">
      <header className="sticky z-20 px-4 md:px-8 pt-3 md:pb-3" style={{top:'env(safe-area-inset-top,0px)',background:'color-mix(in srgb,var(--bg) 88%,transparent)',backdropFilter:'blur(10px)',borderBottom:'1px solid var(--bd)'}}>
        <div className="flex items-center justify-between gap-3 pb-2 md:pb-0"><div className="flex items-center gap-2.5"><div className="md:hidden w-8 h-8 rounded-lg grid place-items-center" style={{background:'linear-gradient(135deg,var(--br),var(--bm))',color:'var(--on)'}}><Radar size={18}/></div><div><h1 className="font-extrabold text-lg leading-tight">{cur[1]}</h1><div className="md:hidden mu text-[11px] font-medium leading-none">saintcelucid</div></div></div>
          <div className="flex items-center gap-2"><span className="hidden sm:inline-flex badge" style={{color:er&&src!=='live'?'var(--dn)':'var(--up)',background:`color-mix(in srgb,var(${er&&src!=='live'?'--dn':'--up'}) 16%,transparent)`}}>{srcLb}</span><button aria-label="Muat ulang harga" onClick={()=>{load();if(tf==='d')loadD()}} className="card w-9 h-9 grid place-items-center"><RefreshCw size={16} className={ld||ldD?'animate-spin':''}/></button><button aria-label="Ganti tema" onClick={()=>setTh(th==='dark'?'light':'dark')} className="card w-9 h-9 grid place-items-center">{th==='dark'?<Sun size={17}/>:<Moon size={17}/>}</button></div></div>
        <nav className="md:hidden flex gap-1.5 overflow-x-auto pb-2 -mx-1 px-1">{NAV.map(([k,l,I])=><button key={k} className="nav" data-on={pg===k} onClick={()=>setPg(k)} style={{padding:'7px 11px',fontSize:13}}><I size={15}/>{l}</button>)}</nav>
      </header>
      <main className="px-4 md:px-8 py-5 space-y-4 max-w-6xl"><Page c={c}/>
        <footer className="mu text-xs flex gap-2 pt-2 pb-4"><Info size={15} className="shrink-0 mt-0.5"/><p>Hasil dihitung dari harga penutupan (Yahoo Finance atau file Anda), tanpa memperhitungkan slippage dan likuiditas. Bar terakhir adalah harga periode berjalan sehingga belum final. CAGR = (nilai akhir / nilai awal)^(1 / jumlah tahun) − 1. Bukan nasihat investasi.</p></footer></main>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
